[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.2.0"
description = "Complaint and adverse-event triage for life-sciences customer feedback on Amazon Bedrock, Comprehend Medical and Aurora PostgreSQL"
requires-python = ">=3.11"
license = "MIT-0"
dependencies = [
    "anthropic[bedrock]>=2.12,<3",
    "boto3>=1.40",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["streamlit>=1.45,<2"]
dev = ["pytest>=8", "ruff>=0.12", "cfn-lint>=1.30"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.setuptools.package-data]
triage = ["schema.sql"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
